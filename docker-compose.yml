services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: pointdesk
      MYSQL_USER: pointdesk
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
    volumes:
      - pointdesk_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u pointdesk -p\"$${MYSQL_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: mysql://pointdesk:${MYSQL_PASSWORD}@db:3306/pointdesk
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
volumes:
  pointdesk_mysql:
